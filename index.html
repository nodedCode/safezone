    <!--
        Content Security Policy
        Permits AdSense ad delivery and Google Fonts while blocking all other
        external origins. 'unsafe-inline' is required by Vite's injected styles.
    -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval'
            https://pagead2.googlesyndication.com
            https://partner.googleadservices.com
            https://www.googletagservices.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https:;
        media-src 'self' blob:;
        connect-src 'self' https://pagead2.googlesyndication.com;
        frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com;
    ">

    <!--
        Google AdSense
        Replace ca-pub-0000000000000000 with the approved publisher ID once
        AdSense account approval is granted.
    -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-0000000000000000" crossorigin="anonymous"></script>

    <!-- DNS resolution pre-warming for external origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://nodedcode.studio">

    <!-- Google Fonts: Inter (body) + Outfit (headings) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap">
